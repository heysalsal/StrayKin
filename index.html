    <script>
      /**
       * Auto-Reload & Cache Buster Handler
       * Catches missing JS chunks after new deployments and forces a clean reload
       * instead of leaving the user on a blank screen.
       */
      window.addEventListener('vite:preloadError', function(event) {
        console.warn('[CacheBuster] Vite dynamic chunk failed to load. Purging cache and reloading...', event);
        event.preventDefault();
        try {
          var lastReload = sessionStorage.getItem('straykin_preload_reload');
          var now = Date.now();
          if (!lastReload || (now - Number(lastReload)) > 8000) {
            sessionStorage.setItem('straykin_preload_reload', String(now));
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(name) { return caches.delete(name); }));
              }).finally(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        } catch(e) {
          window.location.reload();
        }
      });

      window.addEventListener('error', function(event) {
        var msg = (event && event.message) ? String(event.message).toLowerCase() : '';
        if (
          msg.indexOf('failed to fetch dynamically imported module') !== -1 ||
          msg.indexOf('loading chunk') !== -1 ||
          msg.indexOf('error loading dynamically imported module') !== -1
        ) {
          var lastReload = sessionStorage.getItem('straykin_chunk_reload');
          var now = Date.now();
          if (!lastReload || (now - Number(lastReload)) > 8000) {
            sessionStorage.setItem('straykin_chunk_reload', String(now));
            console.warn('[CacheBuster] Caught fatal dynamic chunk load error. Reloading app...');
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(name) { return caches.delete(name); }));
              }).finally(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      });
    </script>
    <script>
      /**
       * Straykin PWA Environment & Monetization Handler
       * Executes early (Head) to prevent race conditions or UI flashing.
       */
      (function() {
        try {
          // 1. Native App Environment Detection
          var isNativeAndroidBridge = window.AndroidLauncher && typeof window.AndroidLauncher.isNativeApp === 'function' && window.AndroidLauncher.isNativeApp();
          var isNativeAndroidUserAgent = navigator.userAgent.includes("StraykinAndroidApp");
          var isNativeAndroid = isNativeAndroidBridge || isNativeAndroidUserAgent;

          // Detect OS
          var userAgent = navigator.userAgent || navigator.vendor || window.opera;
          var isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
          var isWindows = /Win/.test(userAgent);
          var isMac = /Mac/.test(userAgent) && !isIOS;
          var isAndroid = /android/i.test(userAgent);

          // 3. iOS & Desktop Exclusion
          if (isIOS || isWindows || isMac) {
             // Let the PWA load fully and normally
          } else if (isAndroid && !isNativeAndroid) {
            // 2. Smart Android Redirection Flow
            // Redirect pure mobile browser users on Android to Play Store
            // TODO: Uncomment when Android app is live in Play Store
            // window.location.replace("https://play.google.com/store/apps/details?id=com.yourcompany.straykin");
            // return;
          }

          // 4. Dynamic Hybrid Monetization Engine
          document.addEventListener("DOMContentLoaded", function() {
            if (isNativeAndroid) {
              // App environment: hide dom container wrappers for web ads
              var adContainer = document.getElementById('web-ad-container');
              if (adContainer) {
                adContainer.style.display = 'none';
              }
              window.__NATIVE_APP__ = true;
            } else {
              window.__NATIVE_APP__ = false;
              // Browser environment: dynamically load Adterra script
              var adScript = document.createElement('script');
              // Replace with your actual adterra script URL
              adScript.src = '//pl22345678.variousadnetwork.com/invoke.js'; 
              adScript.async = true;
              document.head.appendChild(adScript);
            }
          });
        } catch (e) {
          console.error("Environment handler error:", e);
        }
      })();
    </script>
